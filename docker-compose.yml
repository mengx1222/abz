version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: abz-postgres
    environment:
      POSTGRES_USER: abz_user
      POSTGRES_PASSWORD: abz_dev_2026
      POSTGRES_DB: anzhenbao
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abz_user -d anzhenbao"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: abz-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: abz-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DEMO_MODE=true
      - DATABASE_URL=postgresql+asyncpg://abz_user:abz_dev_2026@postgres:5432/anzhenbao
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=dev-secret-key-do-not-use-in-production
      - AI_PROVIDER=mock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: abz-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
