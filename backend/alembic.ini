# Alembic 配置文件

[alembic]
# 迁移脚本目录
script_location = alembic

# 模板文件（用于生成迁移脚本）
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# 系统时区（设为 UTC）
timezone = UTC

# 是否在迁移前自动截断表（危险！仅开发用）
# truncate_tables = false

# 每次迁移是否输出 SQL（true=输出但不执行）
# sqlalchemy.url 不在这里设置，由 env.py 从环境变量读取

# 日志配置
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
