name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install backend dependencies
        run: pip install -e ".[dev]"
      - name: Run pytest
        run: pytest

  frontend:
    name: Frontend tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run vitest
        run: npm test
      - name: TypeScript typecheck (tsc -b)
        # Task 19: TypeScript Hard Gate —— 0 errors 才通过（Task 19 已将 32 errors 清零）
        run: npx tsc -b
      - name: Build (Vite)
        # Task 19: tsc 门禁恢复后走完整 build（tsc -b && vite build）
        run: npm run build

  backend-pg:
    name: Backend tests (PostgreSQL + pgvector)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      # 2026-08-18 GitHub Actions services 机制对 pgvector 镜像报 invalid reference format
      # （workflow 行尾曾污染为 CRLF）→ 规范化 LF + 显式 docker run（验证语义不变）
      - name: Start PostgreSQL (pgvector) container
        run: |
          docker run -d --name pgvector-test -p 5432:5432 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=anzhenbao_test \
            pgvector/pgvector:pg16
          for i in $(seq 1 30); do
            if docker exec pgvector-test pg_isready -U postgres >/dev/null 2>&1; then
              echo "POSTGRES_READY after ${i}x2s"
              break
            fi
            sleep 2
          done
          docker exec pgvector-test pg_isready -U postgres
      - name: Install backend dependencies
        run: pip install -e ".[dev]"
      - name: Run alembic migrations on PostgreSQL
        env:
          AZB_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/anzhenbao_test
        run: python -m alembic upgrade head
      - name: Seed database
        env:
          AZB_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/anzhenbao_test
        run: python -m scripts.seed
      - name: Run PostgreSQL integration tests
        env:
          AZB_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/anzhenbao_test
        run: pytest tests/unit/test_pg_integration.py tests/rag/test_permission_pg.py tests/rag/test_ingestion_pg.py tests/rag/test_org_tree_pg.py tests/rag/test_agent_pg.py tests/knowledge/test_kb_crud.py tests/knowledge/test_document_management.py tests/knowledge/test_e2e_seed_idempotency.py tests/knowledge/test_seed_idempotency.py -v
