name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install backend dependencies
        run: pip install -e ".[dev]"
      - name: Run pytest
        run: pytest

  frontend:
    name: Frontend tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run vitest
        run: npm test
      - name: TypeScript typecheck (tsc -b)
        # Task 19: TypeScript Hard Gate 恢复 —— 0 errors 才通过，exit code != 0 → job failed
        run: npx tsc -b
      - name: Build (Vite)
        # Task 19: tsc 门禁恢复后走完整 build（tsc -b && vite build）
        run: npm run build

  backend-pg:
    name: Backend tests (PostgreSQL + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: anzhenbao_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install backend dependencies
        run: pip install -e ".[dev]"
      - name: Run alembic migrations on PostgreSQL
        env:
          AZB_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/anzhenbao_test
        run: python -m alembic upgrade head
      - name: Seed database
        env:
          AZB_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/anzhenbao_test
        run: python -m scripts.seed
      - name: Run PostgreSQL integration tests
        env:
          AZB_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/anzhenbao_test
        run: pytest tests/unit/test_pg_integration.py tests/rag/test_permission_pg.py -v
