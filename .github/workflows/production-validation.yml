name: Production Environment Validation

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  production-validation:
    name: Real PG16 + pgvector + Redis full-stack validation (Task 8)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # ------------------------------------------------------------
      # 1. Docker Compose — production stack (PG16+pgvector+Redis+Backend)
      # ------------------------------------------------------------
      - name: Prepare .env.production
        run: |
          cat > .env.production <<'EOF'
          AZB_APP_ENV=production
          AZB_DEBUG=false
          AZB_DEMO_MODE=false
          AZB_DATABASE_URL=postgresql+asyncpg://abz_user:abz_dev_2026@postgres:5432/anzhenbao
          AZB_REDIS_URL=redis://redis:6379/0
          AZB_JWT_SECRET_KEY=production-validation-secret-2026
          AZB_AI_PROVIDER=mock
          POSTGRES_USER=abz_user
          POSTGRES_PASSWORD=abz_dev_2026
          POSTGRES_DB=anzhenbao
          EOF

      - name: Docker Compose build (docker-compose.prod.yml)
        continue-on-error: true
        id: compose_build
        run: |
          docker compose --env-file .env.production -f docker-compose.prod.yml build 2>&1 | tail -40
          echo "exit=${PIPESTATUS[0]}"
          docker compose --env-file .env.production -f docker-compose.prod.yml images

      - name: Docker Compose up (postgres + redis + backend)
        continue-on-error: true
        run: |
          docker compose --env-file .env.production -f docker-compose.prod.yml up -d postgres redis backend 2>&1 | tail -30
          docker compose --env-file .env.production -f docker-compose.prod.yml ps

      - name: Wait for compose backend ready
        continue-on-error: true
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/v1/ready > /dev/null 2>&1; then
              echo "COMPOSE_BACKEND_READY after $((i * 5))s"
              curl -s http://127.0.0.1:8000/api/v1/ready; echo
              exit 0
            fi
            sleep 5
          done
          echo "COMPOSE_BACKEND_NOT_READY"
          docker compose --env-file .env.production -f docker-compose.prod.yml logs backend --tail 40 || true

      - name: Compose health / ready / frontend checks
        continue-on-error: true
        run: |
          echo "== compose /api/v1/health =="
          curl -s http://127.0.0.1:8000/api/v1/health; echo
          echo "== compose /api/v1/ready =="
          curl -s http://127.0.0.1:8000/api/v1/ready; echo
          echo "== compose frontend :3000 =="
          curl -s -o /dev/null -w "HTTP %{http_code}\n" http://127.0.0.1:3000 || echo "frontend not up (expected if build blocked by tsc)"

      # ------------------------------------------------------------
      # 2. Backend deps (host) for phase7/phase8/pytest
      # ------------------------------------------------------------
      - name: Install backend deps (host side, for validation scripts)
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client redis-tools
          cd backend
          pip install -e ".[dev]"
          pip install psycopg2-binary redis requests

      # ------------------------------------------------------------
      # 3. Alembic + Seed on real PG (via compose postgres)
      # ------------------------------------------------------------
      - name: Alembic upgrade head on compose PostgreSQL
        continue-on-error: true
        env:
          AZB_DATABASE_URL: postgresql+asyncpg://abz_user:abz_dev_2026@localhost:5432/anzhenbao
        run: |
          cd backend
          python -m alembic upgrade head
          echo "ALEMBIC_OK"

      - name: Seed database
        continue-on-error: true
        env:
          AZB_DATABASE_URL: postgresql+asyncpg://abz_user:abz_dev_2026@localhost:5432/anzhenbao
        run: |
          cd backend
          python -m scripts.seed
          echo "SEED_OK"

      # ------------------------------------------------------------
      # 4. Phase 7 — PG + pgvector + Redis full verification
      # ------------------------------------------------------------
      - name: Phase 7 verification
        continue-on-error: true
        env:
          AZB_DATABASE_URL: postgresql+asyncpg://abz_user:abz_dev_2026@localhost:5432/anzhenbao
        run: |
          cd backend
          python scripts/phase7_pg_verify.py --db-url "postgresql+asyncpg://abz_user:abz_dev_2026@localhost:5432/anzhenbao" || echo "PHASE7_EXIT=$?"

      # ------------------------------------------------------------
      # 5. Phase 8 — production core business flow (real API + DB)
      # ------------------------------------------------------------
      - name: Phase 8 — core business flow smoke (compose backend, production)
        continue-on-error: true
        env:
          AZB_BASE_URL: http://127.0.0.1:8000
        run: |
          cd backend
          python scripts/phase8_production_core_flow.py || echo "PHASE8_EXIT=$?"

      # ------------------------------------------------------------
      # 6. Full backend pytest on real PG
      # ------------------------------------------------------------
      - name: Backend full pytest on real PostgreSQL
        continue-on-error: true
        env:
          AZB_TEST_DATABASE_URL: postgresql+asyncpg://abz_user:abz_dev_2026@localhost:5432/anzhenbao
        run: |
          cd backend
          pytest || echo "PYTEST_EXIT=$?"

      # ------------------------------------------------------------
      # 7. Demo/Production separation check
      # ------------------------------------------------------------
      - name: Verify DEMO_MODE=false production wiring
        run: |
          cd backend
          python - <<'EOF'
          import os
          os.environ["AZB_DEMO_MODE"] = "false"
          from app.core.config import settings
          assert settings.DEMO_MODE is False
          print("DEMO_MODE =", settings.DEMO_MODE)
          print("effective_ai_provider =", settings.effective_ai_provider)
          print("db host =", settings.DATABASE_URL.split("@")[1].split("/")[0])
          EOF

      # ------------------------------------------------------------
      # 8. Frontend: vitest + vite build + npm run build (tsc) result
      # ------------------------------------------------------------
      - name: Frontend vitest
        continue-on-error: true
        run: |
          cd frontend
          npm ci
          npm test || echo "VITEST_EXIT=$?"

      - name: Frontend vite build
        continue-on-error: true
        run: |
          cd frontend
          npx vite build || echo "VITE_BUILD_EXIT=$?"

      - name: Frontend npm run build (tsc) — real result
        continue-on-error: true
        run: |
          cd frontend
          if npm run build 2>/tmp/tsc-build.log; then
            echo "TSC_BUILD=OK"
          else
            echo "TSC_BUILD=FAIL"
            grep -E "error TS" /tmp/tsc-build.log | head -15 || echo "(no TS errors captured)"
          fi

      # ------------------------------------------------------------
      # 9. Final status
      # ------------------------------------------------------------
      - name: Final stack status
        if: always()
        run: |
          docker compose --env-file .env.production -f docker-compose.prod.yml ps || true
          echo "=== backend logs ==="
          docker compose --env-file .env.production -f docker-compose.prod.yml logs backend --tail 25 || true
