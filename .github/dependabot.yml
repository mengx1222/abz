# Dependabot 依赖自动更新（每周一扫描）
# 目标：试点/生产环境依赖安全补丁跟得上；升级 PR 每周集中处理一次
version: 2
updates:
  # 后端 Python 依赖
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "backend"]
    open-pull-requests-limit: 5

  # 前端 npm 依赖
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "frontend"]
    open-pull-requests-limit: 5

  # GitHub Actions 版本
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "ci"]
