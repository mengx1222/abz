# ============================================================
# 安诊保 AI 副驾 — Nginx 配置
# 功能：SPA 路由回退 + API 反向代理 + SSE 支持 + 静态资源缓存
# ============================================================

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # SPA 路由回退：所有非文件/非目录请求回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理（转发到后端服务）
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE（Server-Sent Events）支持
        # 关闭代理缓冲，使流式响应实时推送到客户端
        proxy_buffering off;
        proxy_cache off;

        # SSE 长连接超时设置
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 使用 HTTP/1.1 并清除 Connection 头以支持 keep-alive 长连接
        proxy_http_version 1.1;
        proxy_set_header Connection '';

        # 禁用请求体缓冲（对 SSE 和大文件上传很重要）
        proxy_request_buffering off;
    }

    # 静态资源长期缓存（Vite 构建产物带 hash）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 其他静态资源（图标、字体等）
    location ~* \.(ico|svg|png|jpg|jpeg|gif|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 禁止访问隐藏文件（如 .env）
    location ~ /\. {
        deny all;
        return 404;
    }
}